tempostack:
  storage:
    type: s3
    secretName: tempostack-default-secret
    size: 10Gi
    # Object-storage backend used when minio.enabled is false (vp-s4-storage by default)
    bucket: tempo-data
    endpoint: http://vp-s4-storage.vp-s4-storage.svc:7480

  resources: # Resources are autonomously split between all deployments in the tempostack. Override resources per-deployment in the tempate value.
    limits:
      memory: 6Gi
      cpu: "2"

  tenants:
    mode: openshift
    authentication:
      - tenantName: default
        tenantId: "1610b0c3-c509-4592-a256-a1871353dbfa" # must be unique over the ENTIRE lifetime of the tempo operator deployment

  template: {}
    # gateway:
    #   enabled: true

  rbac:
    enabled: true
    reader:
      resourceNames: []
        # - traces

  # Bundled MinIO is optional; prefer cluster S3 (vp-s4-storage) for OpenShift demos
  minio:
    enabled: false
    bucket: tempo-data

secretStore:
  name: vault-backend
  kind: ClusterSecretStore
  # Defaults target vp-s4-storage API credentials in Vault
  remoteKey: secret/data/global/s4-api-credentials
  accessKeyProperty: AWS_ACCESS_KEY_ID
  secretKeyProperty: AWS_SECRET_ACCESS_KEY
